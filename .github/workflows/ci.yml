name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # lib/ is gitignored (deps installed fresh), so pin the same versions used in development.
      - name: Install Solidity dependencies
        run: |
          git clone --depth 1 --branch v1.16.1 https://github.com/foundry-rs/forge-std.git lib/forge-std
          git clone --depth 1 --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Test (unit, fuzz, invariant)
        run: forge test -vv

  resolver:
    name: Resolver (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resolver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resolver/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
